name: Update night lights data

on:
  workflow_dispatch:
    inputs:
      which:
        description: "all, daily or monthly"
        default: "all"
  schedule:
    - cron: "17 6 3 * *"   # 3rd of each month, 06:17 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements-pipeline.txt

      - name: Restore NASA file cache
        uses: actions/cache@v4
        with:
          path: .cache/blackmarble
          key: blackmarble-${{ github.run_id }}
          restore-keys: blackmarble-

      - name: Download and extract
        env:
          NASA_TOKEN: ${{ secrets.NASA_TOKEN }}
        run: python src/fetch.py "${{ github.event.inputs.which || 'all' }}"

      - name: Build recovery measures
        run: python src/analysis.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/raw/jamaica_parishes.geojson
          git diff --cached --quiet || git commit -m "Update night lights data"
          git push
